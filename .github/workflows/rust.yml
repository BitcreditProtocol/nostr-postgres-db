name: Rust CI

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        uses: BitcreditProtocol/.github/.github/actions/free-disk-space@6de4960af50d86d1d76a813b27a9a700a68da7c8 # v1.0.0

      - name: Switch rust version
        run: rustup default stable

      - name: Update rust
        run: rustup update

      - name: Add rustup components
        run: rustup component add clippy rustfmt

      - name: Install required cargo
        run: cargo install cargo-deny clippy-sarif sarif-fmt

      - name: Activate cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "nostr-postgres"

      - name: Check
        run: cargo check --verbose

      - name: Check formatting
        run: cargo fmt -- --check

      # `shell: bash` turns on pipefail. Without it the step exits with sarif-fmt's status,
      # so a clippy compile error could never fail the step.
      - name: Clippy
        shell: bash
        run:
          cargo clippy
          --verbose
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt

      - name: Cargo deny
        run: cargo deny check

      - name: Build
        run: cargo build --verbose

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
