[package]
name = "nostr-postgres-db"
version = "0.2.0"
edition = "2024"
description = "Postgres SQL storage backend for Nostr relays"
keywords = ["nostr", "database", "postgres"]
license = "MIT"

[dependencies]
nostr = { git = "https://github.com/BitcreditProtocol/nostr.git", rev = "d60e3ebc77c7833db917c3030c145883b8f0ee62", features = ["std"] }
nostr-database = { git = "https://github.com/BitcreditProtocol/nostr.git", rev = "d60e3ebc77c7833db917c3030c145883b8f0ee62" }
flatbuffers = "25.12"
tracing = { version = "0.1", default-features = false }
tokio-postgres = { version = "0.7", features = [
  "with-serde_json-1",
] }
deadpool-postgres = "0.14"

[dev-dependencies]
# `Keys::generate` needs an OS random source
nostr = { git = "https://github.com/BitcreditProtocol/nostr.git", rev = "d60e3ebc77c7833db917c3030c145883b8f0ee62", features = ["std", "os-rng"] }
nostr-sdk = { git = "https://github.com/BitcreditProtocol/nostr.git", rev = "d60e3ebc77c7833db917c3030c145883b8f0ee62", features = ["local-relay"] }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "time",
] }
tracing-subscriber = "0.3"
testcontainers = "0.28"

[[example]]
name = "postgres-relay"
